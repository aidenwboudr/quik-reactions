name: Build reactions APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Use the stable debug signing key
      # Each runner makes a fresh debug key, and an APK signed with a different key
      # can't update the one on the phone, so the key comes from a repo secret.
      env:
        DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      run: |
        if [[ -z "$DEBUG_KEYSTORE_B64" ]]; then
          echo "DEBUG_KEYSTORE_B64 secret is missing" >&2
          exit 1
        fi
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: List APK Output Directory 
      run: ls -R presentation/build/outputs/apk/debug

    - name: Rename APK
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        mapfile -t apk_files < <(printf '%s\n' presentation/build/outputs/apk/debug/QUIK-v*-debug.apk)
        if [[ "${#apk_files[@]}" -eq 0 ]]; then
          echo "No APK found matching QUIK-v*-debug.apk" >&2
          exit 1
        fi
        if [[ "${#apk_files[@]}" -gt 1 ]]; then
          echo "Multiple APKs found: ${apk_files[*]}" >&2
          exit 1
        fi
        mv "${apk_files[0]}" presentation/build/outputs/apk/debug/QUIK-debug.apk

    - name: Upload App
      uses: actions/upload-artifact@v7
      with:
        name: apk-debug
        path: presentation/build/outputs/apk/debug/QUIK-debug.apk

